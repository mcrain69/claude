<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgencyZoom Sales Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --az-blue: #1a3a5c;
      --az-teal: #0097b2;
      --az-green: #27ae60;
      --az-orange: #e67e22;
      --az-red: #e74c3c;
      --az-purple: #8e44ad;
      --bg: #f0f4f8;
      --card: #ffffff;
      --border: #dde3ea;
      --text: #1e293b;
      --muted: #64748b;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: var(--az-blue);
      color: #fff;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 38px; height: 38px; border-radius: 8px;
      background: var(--az-teal);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -1px;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
    header h1 span { color: #7ecfe0; font-weight: 400; font-size: 14px; margin-left: 6px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .period-badge {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: #e0f4f8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s;
    }
    .period-badge:hover { background: rgba(255,255,255,.22); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--az-teal);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
    }

    /* ── Layout ──────────────────────────────────── */
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }

    /* ── Two-column section ──────────────────────── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }

    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

    /* ── Chart Cards ─────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .card-body { padding: 20px; }
    .chart-wrap { position: relative; }

    /* ── Pipeline Funnel ─────────────────────────── */
    .pipeline-row { margin-bottom: 14px; }
    .pipeline-label {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--text); margin-bottom: 5px;
    }
    .pipeline-label span:last-child { font-weight: 700; color: var(--az-teal); }
    .pipeline-bar { height: 10px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
    .pipeline-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }

    /* ── Utility ─────────────────────────────────── */
    .text-green  { color: var(--az-green); }
    .text-muted  { color: var(--muted); }
    .font-bold   { font-weight: 700; }
    .last-updated { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>

<!-- ══ Header ══════════════════════════════════════ -->
<header>
  <div class="header-left">
    <div class="logo">AZ</div>
    <h1>AgencyZoom <span>Sales Dashboard</span></h1>
  </div>
  <div class="header-right">
    <span class="period-badge">📅 YTD 2026</span>
    <div class="avatar">JD</div>
  </div>
</header>

<!-- ══ Main ════════════════════════════════════════ -->
<main>

  <div id="globalError" style="display:none;background:#fee2e2;color:#991b1b;padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;"></div>

  <div class="two-col">

    <!-- Policy Mix -->
    <div class="card">
      <div class="card-header">
        <h3>Policy Mix</h3>
        <span id="mixPolicyCount" class="last-updated">— policies</span>
      </div>
      <div class="card-body">
        <div class="chart-wrap" style="height:220px">
          <canvas id="mixChart"></canvas>
        </div>
        <div id="mixLegend" style="margin-top:16px;display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>

    <!-- Lead Pipeline -->
    <div class="card">
      <div class="card-header">
        <h3>Lead Pipeline</h3>
        <span id="pipelineTotal" class="last-updated">— leads</span>
      </div>
      <div class="card-body">
        <div id="pipelineRows"></div>
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;">
          <span class="text-muted">Conversion rate</span>
          <span id="conversionRate" class="font-bold text-green">—</span>
        </div>
      </div>
    </div>

  </div>

</main>

<script>
/* ─── API base (same origin when served by Express) ── */
const API = '/api/dashboard';

/* ─── Chart palette ─────────────────────────────── */
const colors = {
  teal:'#0097b2', navy:'#1a3a5c', green:'#27ae60',
  orange:'#e67e22', red:'#e74c3c', purple:'#8e44ad',
};
const colorList = Object.values(colors);
const FONT = "'Segoe UI','Helvetica Neue',sans-serif";
Chart.defaults.font.family = FONT;
Chart.defaults.color = '#64748b';

/* ─── Policy Mix Donut ──────────────────────────── */
function initMixChart(lines) {
  const labels   = lines.map(l => l.label);
  const counts   = lines.map(l => l.count);
  const bgColors = lines.map((_,i) => colorList[i % colorList.length]);

  new Chart(document.getElementById('mixChart').getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets:[{ data:counts, backgroundColor:bgColors, borderWidth:2, borderColor:'#fff', hoverOffset:6 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: ctx=>` ${ctx.label}: ${ctx.parsed}` } } }
    }
  });

  const total = counts.reduce((a,b)=>a+b,0);
  const legend = document.getElementById('mixLegend');
  if (legend) {
    legend.innerHTML = lines.map((l,i)=>`
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${bgColors[i]};margin-right:6px;"></span>${l.label}</span>
        <span class="font-bold">${l.count} <span class="text-muted">(${total>0?Math.round(l.count/total*100):0}%)</span></span>
      </div>`).join('');
  }

  const hdr = document.getElementById('mixPolicyCount');
  if (hdr) hdr.textContent = total + ' policies';
}

/* ─── Pipeline ──────────────────────────────────── */
function renderPipeline(p) {
  const stages = [
    { label:'🔵 New Leads',  key:'new',       color:'#0097b2' },
    { label:'🟡 Contacted',  key:'contacted',  color:'#f59e0b' },
    { label:'🟠 Quoted',     key:'quoted',     color:'#e67e22' },
    { label:'🟢 Proposal',   key:'proposal',   color:'#27ae60' },
    { label:'✅ Closed Won', key:'won',        color:'#1a3a5c' },
    { label:'❌ Lost',       key:'lost',       color:'#e74c3c' },
  ];
  const total = p.new || 1;
  const el = document.getElementById('pipelineRows');
  if (!el) return;
  el.innerHTML = stages.map(s=>`
    <div class="pipeline-row">
      <div class="pipeline-label"><span>${s.label}</span><span>${p[s.key] ?? 0}</span></div>
      <div class="pipeline-bar"><div class="pipeline-fill" style="width:${Math.round((p[s.key]??0)/total*100)}%;background:${s.color};"></div></div>
    </div>`).join('');

  const totalEl = document.getElementById('pipelineTotal');
  if (totalEl) totalEl.textContent = (p.total ?? 0) + ' leads';

  const cr = document.getElementById('conversionRate');
  if (cr) cr.textContent = p.conversionRate + '%';
}

/* ─── Error state ───────────────────────────────── */
function showError(msg) {
  const el = document.getElementById('globalError');
  if (el) { el.textContent = '⚠ ' + msg; el.style.display = 'block'; }
  console.error(msg);
}

/* ─── Main loader ───────────────────────────────── */
async function loadDashboard() {
  try {
    const [mixRes, pipelineRes] = await Promise.all([
      fetch(`${API}/policy-mix`),
      fetch(`${API}/pipeline`),
    ]);
    if (!mixRes.ok)      throw new Error(`Policy mix returned ${mixRes.status}`);
    if (!pipelineRes.ok) throw new Error(`Pipeline returned ${pipelineRes.status}`);

    const [policyMix, pipeline] = await Promise.all([mixRes.json(), pipelineRes.json()]);

    initMixChart(policyMix);
    renderPipeline(pipeline);
  } catch (err) {
    showError('Could not load dashboard data: ' + err.message);
  }
}

loadDashboard();
</script>
</body>
</html>
